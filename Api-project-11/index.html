<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Live Profile Fetcher </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="card">
        <h2>GitHub Fetcher</h2>

        <div class="search-box">
            <input type="text" id="username-input" placeholder="Enter username...">
            <button id="search-btn">Search</button>
        </div>

        <div class="profile-card">
            <img id="avatar" src="https://via.placeholder.com/100" alt="Avatar">
            <h3 id="name">User Name</h3>
            <p id="bio">Bio description goes here</p>
        </div>

        <div class="stats">
            <span id="repos">Repos: 0</span>
            <span id="followers">Followers: 0</span>
        </div>
    </div>
</body>

</html>
