<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fawad Ali | Full Stack Developer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- 1. Navigation Bar -->
    <header>
        <nav class="navbar">
            <h2 class="logo">FA.</h2>
            <ul class="nav-links">
                <li><a href="#hero">Home</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 2. Hero Section (Tumhara First Impression) -->
    <section id="hero" class="section">
        <div class="hero-content">
            <h1>Hi, I'm Fawad Ali</h1>
            <p>I build interactive and responsive web applications.</p>
            <a href="#projects" class="btn">View My Work</a>
        </div>
    </section>

    <!-- 3. Projects Section (Tumhara Portfolio) -->
    <section id="projects" class="section">
        <h2>Featured Projects</h2>
        <div class="project-grid">
            <!-- Yahan hum future mein JS projects ke cards banayenge -->
        </div>
    </section>

    <!-- 4. Contact Section (Clients ke liye) -->
    <section id="contact" class="section">
        <h2>Let's Work Together</h2>
        <form id="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" rows="5" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

</body>

</html>
