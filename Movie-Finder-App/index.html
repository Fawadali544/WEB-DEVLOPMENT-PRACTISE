<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js " defer></script>
</head>

<body>
    <div class="container">
        <h1>🎬 Movie & Show Finder</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Enter movie name (e.g. Batman)...">
            <button id="search-btn">Search</button>
        </div>

        <!-- Is khali dabbe ke andar JS khud sare cards banayega -->
        <div id="movies-grid" class="grid"></div>
    </div>
    <script src="script.js" defer></script>
</body>

</html>
